# Site settings
title: Luwei Ying
email: luweiying@ucla.edu
description: >-
  Political scientist at UCLA studying international conflict, political violence, and the methods used to understand them.
url: "https://luweiying.org"
github_username: Luwei-Ying

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/og.png
        width: 1730
        height: 909
        alt: "Luwei Ying — Political science at UCLA"

permalink: /blog/:year/:month/:title.html
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Build settings
markdown: kramdown
theme: minima

exclude:
  - README.md
  - .bundle
  - .venv
