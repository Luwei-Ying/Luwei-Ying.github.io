---
layout: default
---
<header class="page-hero shell{% unless page.intro %} page-hero-compact{% endunless %}">
  {% if page.kicker %}<p class="eyebrow">{{ page.kicker }}</p>{% endif %}
  <h1>{{ page.title }}</h1>
  {% if page.intro %}<p class="page-intro">{{ page.intro }}</p>{% endif %}
</header>

<div class="page-content">
  {{ content }}
</div>
